[tool.poetry]
name = "fast-stack"
version = "0.0.1"
description = "Demo of a modern full stack application using FastAPI, FastStream and FastUI"
authors = ["Gabriel G <gabriel59kg@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {version = "^0.115.5", extras = ["standard"]}
# faststream = "^0.5.29"
fastui = "^0.7.0"
pydantic = "~2.9"

[tool.poetry.group.dev.dependencies]
invoke = "^2.2.0"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
pytest = "^8.3.4"
ruff = "^0.8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
files = ["fast_stack/", "tests/", "tasks.py"]
strict = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = 'normal'
warn_redundant_casts = true
show_error_codes = true
implicit_reexport = true # enabled due to strict mode
enable_error_code = [
    'ignore-without-code',
    'explicit-override',
    'possibly-undefined',
]


[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ['no-untyped-def']

[tool.ruff]
target-version = "py312"
